# Serving OpenNoteTaker.
#
# Three things here are load-bearing rather than boilerplate, and each has a
# symptom that looks like an application bug when it is missing.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Cross-origin isolation. ONNX Runtime's threaded WebAssembly build
    #    needs SharedArrayBuffer, which browsers only expose to a
    #    cross-origin-isolated document. Without these two headers the runtime
    #    quietly drops to one thread and transcription takes several times
    #    longer -- with no error anywhere to explain it.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # 2. A content security policy that states the privacy claim in a form the
    #    browser enforces. `connect-src` is the important line: the page may
    #    fetch model weights from Hugging Face and talk to its own account and
    #    gateway hosts, and nothing else. If a dependency ever tried to phone
    #    home, this would break it rather than allow it.
    #
    #    Adjust the last two entries if you run your own gateway; delete them
    #    if you run none, and the paid features simply will not work.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' blob: https://huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.hf.co https://auth.opennotetaker.app https://gateway.opennotetaker.app; frame-ancestors 'none'; base-uri 'self'" always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 3. WebAssembly must be served as application/wasm for streaming
    #    compilation. Served as octet-stream it still works, by falling back to
    #    a slower non-streaming path, which is exactly the kind of regression
    #    nobody notices.
    types {
        application/wasm wasm;
    }

    location /assets/ {
        # Vite fingerprints these, so they can be cached for ever.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ort/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy same-origin always;
        try_files $uri =404;
    }

    location / {
        # A single page with hash routing, so every path resolves to the same
        # document.
        try_files $uri $uri/ /index.html;
    }
}
