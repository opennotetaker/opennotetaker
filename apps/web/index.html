<!doctype html>
<html lang="en" class="oa-auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenNoteTaker — meeting notes that never leave your machine</title>
    <meta
      name="description"
      content="Transcribe meetings, separate speakers and export subtitles entirely in your browser. No bot joins your call, no audio is uploaded, and there is nothing to cancel."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- No analytics, no tag manager, no font CDN. A privacy claim with a
         tracker behind it is the thing this product competes against, and the
         absence has to be checkable in view-source, not just asserted. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <noscript>
        OpenNoteTaker transcribes audio using WebAssembly in this tab, so it needs JavaScript.
        Nothing is uploaded either way.
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
