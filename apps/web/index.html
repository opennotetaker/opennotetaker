<!doctype html>
<html lang="en" class="oa-auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>OpenNoteTaker — the app</title>
    <!-- The app, on its own: for development, and as the half the site repo
         composes around. opennotetaker.app is one document — this app with the
         product page around it — and the page lives in the private site repo.
         It takes everything from the app-head marker to the end of this head,
         and everything between app:begin and app:end.

         Nothing above the marker is carried across, so the page's own head
         entries cannot be shipped twice. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- app-head -->
  </head>
  <body>
    <!-- The bar's mount. On the composed page this div comes from the page,
         not from here, because on the landing route the bar `topbar()` renders
         into it is the *site's* bar — marketing tabs and the call to action.
         It is repeated here so the app is usable on its own; being outside the
         markers, this copy is not carried across. -->
    <div id="nav"></div>

    <!-- app:begin -->
    <div id="app">
      <noscript>
        OpenNoteTaker transcribes audio using WebAssembly in this tab, so it needs JavaScript.
        Nothing is uploaded either way.
      </noscript>
    </div>
    <!-- app:end -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
